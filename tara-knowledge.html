<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tara Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FBFCFD; --surface:#FFFFFF; --surface-2:#F7F9FB;
    --ink:#14181D; --ink-2:#3A424C; --muted:#697079; --faint:#9AA1AA;
    --line:#E7EBEF; --line-2:#F0F3F6;
    --accent:#147D74; --accent-strong:#0F5F58; --accent-soft:#EAF4F2;
    --warn:#9A6212; --warn-soft:#FBF1DF; --bad:#B3261E; --bad-soft:#FDECEA;
    --radius:14px; --radius-sm:9px;
    --font-ui:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line); }
  .hin { max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .brand { font-weight:600; font-size:16px; }
  .brand b { color:var(--accent-strong); }
  .spacer { flex:1; }
  .btn { border:1px solid var(--line); background:var(--surface); border-radius:100px; padding:7px 14px; font-size:13.5px; cursor:pointer; color:var(--ink-2); }
  .btn:hover { border-color:var(--accent); color:var(--accent-strong); }
  .btn.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.go:hover { background:var(--accent-strong); }
  .btn.warn { color:var(--warn); }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 24px 60px; display:grid; grid-template-columns:330px minmax(0,1fr); gap:22px; align-items:start; }
  .side { position:sticky; top:72px; max-height:calc(100vh - 92px); display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .filters { display:flex; gap:6px; padding:12px; border-bottom:1px solid var(--line-2); flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--surface); border-radius:100px; padding:4px 11px; font-size:12.5px; cursor:pointer; color:var(--muted); }
  .filters button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .search { padding:10px 12px; border-bottom:1px solid var(--line-2); }
  .search input { width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 11px; font-size:14px; }
  .list { overflow-y:auto; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; width:100%; text-align:left; padding:10px 14px; border:0; border-bottom:1px solid var(--line-2); background:none; cursor:pointer; }
  .row:hover { background:var(--surface-2); }
  .row.on { background:var(--accent-soft); }
  .row .n { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .m { grid-column:1; font-size:12.5px; color:var(--muted); }
  .chip { grid-column:2; grid-row:1 / 3; align-self:center; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; border-radius:100px; padding:2px 8px; }
  .chip.approved { background:var(--accent-soft); color:var(--accent-strong); }
  .chip.draft { background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .chip.needs_changes { background:var(--warn-soft); color:var(--warn); }
  .count { padding:10px 14px; font-family:var(--font-mono); font-size:11px; color:var(--muted); border-top:1px solid var(--line-2); }
  .editor { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px 26px; min-height:300px; }
  .ehead { display:flex; align-items:flex-start; gap:12px; margin-bottom:18px; }
  .ehead h1 { margin:0; font-size:24px; letter-spacing:-.01em; line-height:1.2; }
  .ehead .sub { color:var(--muted); font-size:14px; margin-top:4px; }
  .back { display:none; }
  .f { margin-bottom:18px; }
  .f label { display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .f textarea, .f input { width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; font-size:14.5px; line-height:1.55; background:var(--surface); resize:vertical; }
  .f textarea:focus, .f input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .clin { background:var(--accent-soft); border-radius:var(--radius-sm); padding:14px; }
  .clin label { color:var(--accent-strong); }
  .clin .hint { font-size:13px; color:var(--ink-2); margin:-2px 0 8px; }
  .src { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto; gap:8px; margin-bottom:8px; }
  .src a { font-size:12px; align-self:center; color:var(--accent-strong); }
  .src .x { border:0; background:none; color:var(--faint); font-size:20px; cursor:pointer; line-height:1; }
  .acts { position:sticky; bottom:0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:14px 0 4px; background:var(--surface); border-top:1px solid var(--line-2); margin-top:8px; }
  .msg { font-size:13px; color:var(--muted); margin-left:auto; }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
  .gate { max-width:420px; margin:80px auto; text-align:center; color:var(--ink-2); }
  @media (max-width:820px){
    .hin { padding:12px 16px; }
    .wrap { grid-template-columns:1fr; padding:12px 12px 90px; }
    .side { position:static; max-height:none; }
    .editor { display:none; padding:16px; border-radius:0; border:0; }
    body.editing .side { display:none; }
    body.editing .editor { display:block; }
    .back { display:inline-block; }
    .two, .src { grid-template-columns:1fr; }
    .acts { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
    .acts .btn { flex:1; }
    .msg { width:100%; margin:0; order:-1; }
  }
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand">SkinDay <b>Tara Knowledge</b></div>
  <div class="spacer"></div>
  <a class="btn" href="/tara-library" style="text-decoration:none">Library</a>
  <label class="btn" style="cursor:pointer">Import file<input type="file" id="imp" accept=".json,application/json" hidden></label>
</div></header>
<div id="app" class="wrap" hidden>
  <aside class="side">
    <div class="filters" id="filters">
      <button data-s="" class="on">All</button>
      <button data-s="draft">To review</button>
      <button data-s="needs_changes">Needs changes</button>
      <button data-s="approved">Approved</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search products"></div>
    <div class="list" id="list"></div>
    <div class="count" id="count"></div>
  </aside>
  <section class="editor" id="editor"><div class="empty">Choose a product to review.</div></section>
</div>
<div class="gate" id="gate" hidden></div>

<script>
(function(){
  'use strict';
  var API='/.netlify/functions/mi-tara';
  var KEY=null; try{ KEY=localStorage.getItem('mi_session'); }catch(e){}
  var ALL=[], FILTER='', CUR=null;
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function api(action, extra){
    return fetch(API,{method:'POST',headers:{'content-type':'application/json','x-mi-secret':KEY||''},body:JSON.stringify(Object.assign({action:action},extra||{}))})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok){ j.status=r.status; throw j; } return j; }); });
  }
  function gate(msg){ el('app').hidden=true; el('gate').hidden=false; el('gate').innerHTML=msg; }
  var LABELS={ draft:'To review', approved:'Approved', needs_changes:'Needs changes' };

  function load(){
    if(!KEY){ gate('Please <a href="/mi-dashboard">sign in to MI</a> first, then come back to this page.'); return; }
    api('kb_list').then(function(j){
      ALL=j.entries||[]; el('app').hidden=false; paintList();
    }).catch(function(e){
      gate(e&&e.status===401 ? 'Your MI session has expired. Please <a href="/mi-dashboard">sign in again</a>.' : 'This page is only for SkinDay internal accounts.');
    });
  }
  function paintList(){
    var q=el('q').value.trim().toLowerCase();
    var rows=ALL.filter(function(r){
      return (!FILTER || r.status===FILTER) && (!q || (r.product+' '+(r.manufacturer||'')).toLowerCase().indexOf(q)>-1);
    });
    el('list').innerHTML=rows.length ? rows.map(function(r){
      return '<button class="row'+(CUR&&CUR.id===r.id?' on':'')+'" data-id="'+r.id+'"><span class="n">'+esc(r.product)+'</span>'+
        '<span class="chip '+esc(r.status)+'">'+esc(LABELS[r.status]||r.status)+'</span>'+
        '<span class="m">'+esc(r.kind==='primer' ? 'Technology primer' : [r.manufacturer, r.category].filter(Boolean).join(' · '))+'</span></button>';
    }).join('') : '<div class="empty">Nothing here yet.</div>';
    var ap=ALL.filter(function(r){ return r.status==='approved'; }).length;
    el('count').textContent=ap+' of '+ALL.length+' approved';
  }
  el('list').addEventListener('click',function(e){
    var b=e.target.closest('.row'); if(!b) return;
    api('kb_get',{id:b.getAttribute('data-id')}).then(function(j){ CUR=j.entry; paintEditor(); paintList(); document.body.classList.add('editing'); window.scrollTo(0,0); });
  });
  el('filters').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    FILTER=b.getAttribute('data-s');
    Array.prototype.forEach.call(el('filters').children,function(x){ x.classList.toggle('on',x===b); });
    paintList();
  });
  el('q').addEventListener('input',paintList);

  function area(id,label,val,rows){
    return '<div class="f"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" rows="'+(rows||3)+'">'+esc(val||'')+'</textarea></div>';
  }
  function paintEditor(){
    var e=CUR||{}, ap=e.approvals||{}, src=Array.isArray(e.sources)?e.sources:[];
    el('editor').innerHTML=
      '<div class="ehead"><button class="btn back" id="back">‹ List</button><div><h1>'+esc(e.product)+'</h1>'+
      '<div class="sub">'+esc([e.kind==='primer'?'Technology primer':e.manufacturer, e.kind==='primer'?null:e.category, LABELS[e.status]].filter(Boolean).join(' · '))+
      (e.reviewed_at?' · approved '+esc(String(e.reviewed_at).slice(0,10)):'')+'</div></div></div>'+
      area('k_summary','What it is',e.summary,3)+
      area('k_technology','How it works',e.technology,3)+
      area('k_uses','Common uses',e.uses,3)+
      area('k_generations',e.kind==='primer'?'Variants':'Generations and versions',e.generations,2)+
      area('k_treatment','What a treatment involves',e.treatment,3)+
      '<div class="two">'+area('k_ca','Canada approval',ap.canada,2)+area('k_us','US approval',ap.usa,2)+'</div>'+
      '<div class="f clin"><label for="k_clin">Your clinical notes</label><div class="hint">What you have seen in practice. Tara passes this on as experience from SkinDay’s clinical team.</div>'+
      '<textarea id="k_clin" rows="4">'+esc(e.clinical_notes||'')+'</textarea></div>'+
      '<div class="f"><label>Sources</label><div id="srcs">'+src.map(srcRow).join('')+'</div>'+
      '<button class="btn" id="addsrc" type="button">+ Add source</button></div>'+
      area('k_note','Note to Claude (what to change)',e.reviewer_note,2)+
      '<div class="acts"><span class="msg" id="msg"></span>'+
      '<button class="btn" data-st="draft">Save</button>'+
      '<button class="btn warn" data-st="needs_changes">Needs changes</button>'+
      '<button class="btn go" data-st="approved">Approve</button></div>';
    el('back').addEventListener('click',function(){ document.body.classList.remove('editing'); });
    el('addsrc').addEventListener('click',function(){ el('srcs').insertAdjacentHTML('beforeend',srcRow({})); });
    el('srcs').addEventListener('click',function(ev){ var x=ev.target.closest('.x'); if(x) x.parentNode.remove(); });
    Array.prototype.forEach.call(el('editor').querySelectorAll('[data-st]'),function(b){
      b.addEventListener('click',function(){ save(b.getAttribute('data-st')); });
    });
  }
  function srcRow(s){
    return '<div class="src"><input class="sl" placeholder="Label" value="'+esc(s.label||'')+'">'+
      '<input class="su" placeholder="https://..." value="'+esc(s.url||'')+'"><button class="x" type="button" aria-label="Remove">&times;</button></div>';
  }
  function v(id){ var x=el(id); return x ? x.value.trim() : ''; }
  function save(status){
    var sources=Array.prototype.map.call(document.querySelectorAll('#srcs .src'),function(r){
      return { label:r.querySelector('.sl').value.trim(), url:r.querySelector('.su').value.trim() };
    }).filter(function(x){ return x.url || x.label; });
    var entry={ id:CUR.id, status:status, summary:v('k_summary'), technology:v('k_technology'), uses:v('k_uses'),
      generations:v('k_generations'), treatment:v('k_treatment'),
      approvals:{ canada:v('k_ca'), usa:v('k_us') }, clinical_notes:v('k_clin'), sources:sources, reviewer_note:v('k_note') };
    el('msg').textContent='Saving…';
    api('kb_save',{entry:entry}).then(function(j){
      CUR=j.entry;
      ALL=ALL.map(function(r){ return r.id===CUR.id ? Object.assign({},r,{status:CUR.status,updated_at:CUR.updated_at}) : r; });
      paintEditor(); paintList();
      el('msg').textContent=status==='approved'?'Approved. Tara now uses this as fact.':(status==='needs_changes'?'Marked for changes.':'Saved.');
    }).catch(function(e){ el('msg').textContent=(e&&(e.detail||e.error))||'Could not save.'; });
  }
  el('imp').addEventListener('change',function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var data; try{ data=JSON.parse(rd.result); }catch(e){ alert('That file is not valid JSON.'); return; }
      var list=Array.isArray(data)?data:(data.entries||[]);
      // Small chunks, so each call finishes well inside the server time limit.
      var tot={added:0,updated:0,approved:0,kept_approved:0}, i=0, N=15;
      function next(){
        if(i>=list.length){
          alert('Imported: '+tot.added+' new, '+tot.updated+' updated'+(tot.approved?', '+tot.approved+' approved':'')+(tot.kept_approved?', '+tot.kept_approved+' already approved and left as they are':'')+'.');
          el('count').textContent=''; load(); return;
        }
        el('count').textContent='Importing '+Math.min(i+N,list.length)+' of '+list.length+'…';
        api('kb_import',{entries:list.slice(i,i+N)}).then(function(j){
          ['added','updated','approved','kept_approved'].forEach(function(k){ tot[k]+=j[k]||0; });
          i+=N; next();
        }).catch(function(e){ alert(((e&&(e.detail||e.error))||'Import failed')+' (stopped after '+i+' of '+list.length+'; importing the same file again is safe).'); load(); });
      }
      next();
    };
    rd.readAsText(f); this.value='';
  });
  load();
})();
</script>
</body>
</html>
