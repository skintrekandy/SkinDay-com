<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Clinic | SkinDay</title>
  <link rel="canonical" href="https://skinday.com/clinic/" id="meta-canonical" />
  <meta name="description" content="" id="meta-description" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SkinDay" />
  <meta property="og:title" content="" id="og-title" />
  <meta property="og:description" content="" id="og-description" />
  <meta property="og:url" content="" id="og-url" />
  <meta property="og:image" content="" id="og-image" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="" id="tw-title" />
  <meta name="twitter:description" content="" id="tw-description" />
  <meta name="twitter:image" content="" id="tw-image" />
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root {
      --deep:   #1C1714;
      --cream:  #FAF7F2;
      --rose:   #C8725A;
      --gold:   #C9A96E;
      --jade:   #2F7D6B;
      --text:   #2C2724;
      --muted:  #7A6E68;
      --border: #E8E0D6;
      --radius: 12px;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Panels for contacts, verified devices and the doctor team. */
    .panel { border: 1px solid var(--border); background: #fff; border-radius: var(--radius);
             padding: .85rem 1rem; margin: 0 0 .8rem; }
    .panel-head { font-family: var(--font-sans); font-size: .82rem; font-weight: 500;
                  display: flex; align-items: center; justify-content: space-between;
                  gap: .5rem; margin-bottom: .6rem; color: var(--deep); }
    .panel-head em { font-style: normal; font-weight: 400; font-size: .76rem; color: var(--muted); }
    .panel-head .tick { color: var(--gold); margin-right: .35rem; }
    .panel-note { font-size: .72rem; color: var(--muted); margin-top: .55rem; }
    .chip-row { display: flex; flex-wrap: wrap; gap: .35rem; }
    .chip { font-family: var(--font-sans); font-size: .78rem; border: 1px solid var(--border);
            border-radius: 20px; padding: .2rem .62rem; background: var(--cream); color: var(--text); }
    .chip-doctor { font-family: 'Noto Serif TC', var(--font-serif), serif; }
    .contact-row { display: grid; gap: .5rem; }
    .contact-row .btn { width: 100%; justify-content: center; }
    .line-id { font-style: normal; color: var(--muted); font-size: .8rem; margin-left: .3rem; }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
    }

    /* NAV */
    .nav {
      background: var(--deep);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav-logo span { color: var(--gold); }
    .nav-back {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--cream); }

    /* HERO PHOTO */
    .clinic-hero {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background: var(--border);
    }
    .clinic-hero-placeholder {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #E8E0D6 0%, #D4C8BA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clinic-hero-placeholder svg {
      opacity: 0.3;
    }

    /* LAYOUT */
    .clinic-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* BREADCRUMB */
    .breadcrumb {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: var(--rose); }
    .breadcrumb-sep { opacity: 0.5; }

    /* CLINIC NAME + LOCATION */
    .clinic-name {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--deep);
      margin-bottom: 8px;
    }
    .clinic-location {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* COUNTRY PILL */
    .country-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
    }
    .country-pill.taiwan {
      background: rgba(200, 114, 90, 0.12);
      color: var(--rose);
    }
    .country-pill.hongkong {
      background: rgba(47, 125, 107, 0.12);
      color: var(--jade);
    }

    /* RATING ROW */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .rating-stars {
      color: #E8A030;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .rating-score {
      font-weight: 600;
      font-size: 15px;
    }
    .rating-count {
      font-size: 13px;
      color: var(--muted);
    }

    /* DIVIDER */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* INFO GRID */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-item label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .info-item p {
      font-size: 14px;
      color: var(--text);
    }
    .info-item a {
      color: var(--rose);
      text-decoration: none;
      word-break: break-all;
    }
    .info-item a:hover { text-decoration: underline; }

    /* ACTIONS */
    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: var(--deep);
      color: var(--cream);
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* PHOTOS GRID */
    .photos-section h2 {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      margin-bottom: 14px;
      color: var(--deep);
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 32px;
    }
    @media (max-width: 500px) {
      .photos-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .photos-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      background: var(--border);
    }

    /* BACK TO DIRECTORY */
    .back-section {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .back-section a {
      font-size: 14px;
      color: var(--rose);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-section a:hover { text-decoration: underline; }

    /* NOT FOUND */
    .not-found {
      text-align: center;
      padding: 80px 24px;
    }
    .not-found h2 {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: var(--deep);
    }
    .not-found p { color: var(--muted); margin-bottom: 24px; }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Skin<span>Day</span></a>
  <a href="javascript:history.back()" class="nav-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back
  </a>
</nav>

<div id="clinic-root">
  <div class="loading">Loading clinic...</div>
</div>

<script>
(function() {
  const SUPABASE_URL = 'https://vefldlqtyxdywbzdjuia.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZmxkbHF0eXhkeXdiemRqdWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDAwMjgsImV4cCI6MjA4NzkxNjAyOH0.o582sXiUkB3j4FiHEA5rE3ABy_pdTeeK1PnNpNirHZA';

  function toSlug(name) {
    return (name || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '')
      .trim();
  }

  function escapeHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── LINE, the same rules as taiwan.html and crawl-socials.js ────────────
  // A stored line_url is always preferred: lin.ee and page.line.me open in a
  // desktop browser as well as in the app. The R/ti/p form is only built when an
  // @id is all we hold, and there the @ MUST travel as %40 or the link fails.
  function lineHref(c) {
    if (!c) return '';
    if (c.line_url) return c.line_url;
    if (c.line_id) return 'https://line.me/R/ti/p/%40' + encodeURIComponent(String(c.line_id).replace(/^@+/, ''));
    return '';
  }

  function hasContacts(c) {
    return !!(c && (c.facebook_url || c.instagram_url || lineHref(c)));
  }

  // The four manufacturer-verified devices, short labels as on the cards.
  const TECH_LABEL = {
    '\u9CF3\u51F0\u96FB\u6CE2 Thermage FLX': '\u9CF3\u51F0\u96FB\u6CE2',
    '\u7F8E\u570B\u97F3\u6CE2\u4E8C\u4EE3 Ultherapy Prime': '\u7F8E\u570B\u97F3\u6CE2\u4E8C\u4EE3',
    '\u8702\u5DE2\u76AE\u79D2 PicoSure': '\u8702\u5DE2\u76AE\u79D2',
    '\u8D85\u76AE\u79D2 PicoWay': '\u8D85\u76AE\u79D2'
  };

  // Team order, same rank as taiwan.html: a Taiwan clinic is very often named
  // after its founding doctor, and that doctor has to lead.
  function orderTeam(list, clinicName) {
    const cname = String(clinicName || '');
    const rank = function (d) {
      if (d.name_zh && cname.indexOf(d.name_zh) !== -1) return 0;
      const t = d.title || '';
      if (t.indexOf('\u9662\u9577') !== -1) return 1;
      if (t.indexOf('\u4E3B\u4EFB') !== -1) return 2;
      if (t.indexOf('\u4E3B\u6CBB') !== -1) return 3;
      return 4;
    };
    return list.slice().sort(function (a, b) {
      return rank(a) - rank(b) || String(a.name_zh).localeCompare(String(b.name_zh), 'zh-Hant');
    });
  }

  // Structured data. sameAs carries the contact channels M18.3 collected, so a
  // search engine can tie the clinic to its own Facebook, Instagram and LINE.
  function injectJsonLd(clinic, url, loc, country, photo) {
    const same = [clinic.website, clinic.facebook_url, clinic.instagram_url, lineHref(clinic)].filter(Boolean);
    const ld = {
      '@context': 'https://schema.org',
      '@type': 'MedicalClinic',
      name: clinic.name,
      url: url
    };
    if (loc || country) {
      ld.address = { '@type': 'PostalAddress', addressLocality: loc || country,
                     addressCountry: clinic.country === 'hongkong' ? 'HK' : 'TW' };
    }
    if (clinic.phone) ld.telephone = clinic.phone;
    if (photo) ld.image = photo;
    if (same.length) ld.sameAs = same;
    if (clinic.lat && clinic.lng) {
      ld.geo = { '@type': 'GeoCoordinates', latitude: Number(clinic.lat), longitude: Number(clinic.lng) };
    }
    if (clinic.rating && clinic.reviews) {
      ld.aggregateRating = { '@type': 'AggregateRating', ratingValue: String(clinic.rating),
                             reviewCount: String(clinic.reviews), bestRating: '5' };
    }
    let el = document.getElementById('clinic-jsonld');
    if (!el) {
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'clinic-jsonld';
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(ld);
  }

  function starsHtml(rating) {
    if (!rating) return '';
    const full = Math.floor(rating);
    const half = rating - full >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    return '\u2605'.repeat(full) + (half ? '\u00BD' : '') + '\u2606'.repeat(empty);
  }

  function countryLabel(country, lang) {
    if (country === 'taiwan') return lang === 'zh' ? '\u53F0\u7063' : 'Taiwan';
    if (country === 'hongkong') return lang === 'zh' ? '\u9999\u6E2F' : 'Hong Kong';
    return '';
  }

  function primaryLang(country) {
    return (country === 'taiwan' || country === 'hongkong') ? 'zh' : 'en';
  }

  function dirPath(country) {
    if (country === 'taiwan') return '/taiwan';
    if (country === 'hongkong') return '/hongkong';
    return '/';
  }

  function updateMeta(clinic) {
    const lang = primaryLang(clinic.country);
    // The canonical URL comes from the STORED slug. Deriving it from the name
    // was how this page produced /clinic/sofwave for an Airlee branch: Taiwan
    // clinic names are SEO keyword strings, so stripping non-ASCII leaves
    // whatever device brand sits in the marketing tail.
    const slug = clinic.slug || toSlug(clinic.name);
    const url = 'https://skinday.com/clinic/' + slug;
    const loc = clinic.neighbourhood || clinic.district || '';
    const country = countryLabel(clinic.country, lang);
    const photo = (clinic.photos && clinic.photos.length) ? clinic.photos[0] : 'https://skinday.com/og-default.jpg';

    let title, desc;
    if (lang === 'zh') {
      title = clinic.name + ' - ' + loc + '\u91AB\u7F8E\u8A3A\u6240 | SkinDay';
      desc = clinic.name + '\uFF0C\u4F4D\u65BC' + country + loc + '\u7684\u91AB\u7F8E\u8A3A\u6240\u3002\u5728 SkinDay \u67E5\u770B\u8A3A\u6240\u8CC7\u8A0A\u3001\u670D\u52D9\u9805\u76EE\u8207\u806F\u7D61\u65B9\u5F0F\u3002';
    } else {
      title = clinic.name + ' - ' + loc + ' Aesthetic Clinic | SkinDay';
      desc = clinic.name + ' is an aesthetic clinic in ' + loc + ', ' + country + '. View services, photos and contact details on SkinDay.';
    }

    document.title = title;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';

    const setMeta = (id, attr, val) => {
      const el = document.getElementById(id);
      if (el) el.setAttribute(attr, val);
    };
    const canonical = document.getElementById('meta-canonical');
    if (canonical) canonical.href = url;
    setMeta('meta-description', 'content', desc);
    setMeta('og-title', 'content', title);
    setMeta('og-description', 'content', desc);
    setMeta('og-url', 'content', url);
    setMeta('og-image', 'content', photo);
    setMeta('tw-title', 'content', title);
    setMeta('tw-description', 'content', desc);
    setMeta('tw-image', 'content', photo);
  }

  function renderClinic(clinic, doctors, devices) {
    doctors = doctors || [];
    devices = devices || [];
    updateMeta(clinic);

    const lang = primaryLang(clinic.country);
    const loc = clinic.neighbourhood || clinic.district || '';
    const country = countryLabel(clinic.country, lang);
    const countryClass = clinic.country === 'hongkong' ? 'hongkong' : 'taiwan';
    const dirUrl = dirPath(clinic.country);
    const photos = Array.isArray(clinic.photos) ? clinic.photos : [];

    // Breadcrumb labels
    const homeLbl = lang === 'zh' ? '\u9996\u9801' : 'Home';
    const dirLbl = lang === 'zh' ? (clinic.country === 'hongkong' ? '\u9999\u6E2F\u76EE\u9304' : '\u53F0\u7063\u76EE\u9304') : (clinic.country === 'hongkong' ? 'Hong Kong Directory' : 'Taiwan Directory');
    const backLbl = lang === 'zh' ? '\u8FD4\u56DE\u76EE\u9304' : 'Back to directory';

    // Rating
    let ratingHtml = '';
    if (clinic.rating) {
      ratingHtml = '<div class="rating-row">' +
        '<span class="rating-stars">' + starsHtml(parseFloat(clinic.rating)) + '</span>' +
        '<span class="rating-score">' + escapeHtml(String(clinic.rating)) + '</span>' +
        (clinic.reviews ? '<span class="rating-count">(' + escapeHtml(String(clinic.reviews)) + (lang === 'zh' ? ' \u5247\u8A55\u8AD6' : ' reviews') + ')</span>' : '') +
        '</div>';
    }

    // Hero photo or placeholder
    let heroHtml = '';
    if (photos.length > 0) {
      heroHtml = '<img class="clinic-hero" src="' + escapeHtml(photos[0]) + '" alt="' + escapeHtml(clinic.name) + '" loading="eager" />';
    } else {
      heroHtml = '<div class="clinic-hero-placeholder"><svg width="48" height="48" fill="none" stroke="#999" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>';
    }

    // Info items
    const infoItems = [];
    if (loc) {
      infoItems.push({ label: lang === 'zh' ? '\u5730\u5340' : 'Location', value: loc + ', ' + country });
    }
    if (clinic.phone) {
      infoItems.push({ label: lang === 'zh' ? '\u96FB\u8A71' : 'Phone', value: '<a href="tel:' + escapeHtml(clinic.phone) + '">' + escapeHtml(clinic.phone) + '</a>' });
    }
    if (clinic.website) {
      const domain = clinic.website.replace(/^https?:\/\//, '').replace(/\/$/, '');
      infoItems.push({ label: lang === 'zh' ? '\u5B98\u7DB2' : 'Website', value: '<a href="' + escapeHtml(clinic.website) + '" target="_blank" rel="nofollow noopener">' + escapeHtml(domain) + '</a>' });
    }

    const infoGridHtml = infoItems.length
      ? '<div class="info-grid">' + infoItems.map(i => '<div class="info-item"><label>' + i.label + '</label><p>' + i.value + '</p></div>').join('') + '</div>'
      : '';

    // Action buttons
    const websiteBtn = clinic.website
      ? '<a href="' + escapeHtml(clinic.website) + '" target="_blank" rel="nofollow noopener" class="btn btn-primary">' +
        '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        (lang === 'zh' ? '\u524D\u5F80\u5B98\u7DB2' : 'Visit Website') + '</a>'
      : '';
    const mapsBtn = clinic.place_id
      ? '<a href="https://maps.google.com/?q=' + encodeURIComponent(clinic.name) + '" target="_blank" rel="noopener" class="btn btn-outline">' +
        '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
        (lang === 'zh' ? '\u67E5\u770B\u5730\u5716' : 'View on Map') + '</a>'
      : '';

    // Additional photos
    let photosHtml = '';
    if (photos.length > 1) {
      const morePhotos = photos.slice(1, 7);
      photosHtml = '<div class="photos-section"><h2>' + (lang === 'zh' ? '\u8A3A\u6240\u7167\u7247' : 'Clinic Photos') + '</h2>' +
        '<div class="photos-grid">' +
        morePhotos.map(p => '<img src="' + escapeHtml(p) + '" alt="' + escapeHtml(clinic.name) + '" loading="lazy" />').join('') +
        '</div></div>';
    }

    // ── VERIFIED DEVICES ──────────────────────────────────────────────────
    const devicesHtml = devices.length
      ? '<div class="panel"><div class="panel-head"><span class="tick">\u2713</span>'
        + (lang === 'zh' ? '\u539F\u5EE0\u8A8D\u8A3C\u5100\u5668' : 'Manufacturer-verified devices') + '</div>'
        + '<div class="chip-row">'
        + devices.map(function (t) { return '<span class="chip">' + escapeHtml(TECH_LABEL[t] || t) + '</span>'; }).join('')
        + '</div></div>'
      : '';

    // ── DOCTOR TEAM. Published from what the clinic states on its own site, so
    //    the caveat is on the page rather than implied.
    const teamHtml = doctors.length
      ? '<div class="panel"><div class="panel-head">'
        + (lang === 'zh' ? '\u91AB\u5E2B\u5718\u968A' : 'Doctors')
        + '<em>' + doctors.length + (lang === 'zh' ? ' \u4F4D' : '') + '</em></div>'
        + '<div class="chip-row">'
        + doctors.map(function (d) {
            return '<span class="chip chip-doctor" title="' + escapeHtml(d.title || '') + '">' + escapeHtml(d.name_zh) + '</span>';
          }).join('')
        + '</div><p class="panel-note">'
        + (lang === 'zh'
            ? '\u7531\u8A3A\u6240\u81EA\u884C\u516C\u958B\u4E4B\u8CC7\u6599\u6574\u7406\uFF0C\u975E\u57F7\u696D\u767B\u8A18\u67E5\u6838\u3002'
            : 'Compiled from what the clinic publishes on its own website.')
        + '</p></div>'
      : '';

    // ── CONTACT CHANNELS. LINE first: in Taiwan it is how a patient books. The
    //    @id is printed beside it because the deep link does nothing on a
    //    desktop browser, where a readable id you can type into the app is the
    //    only thing that works.
    let contactHtml = '';
    if (hasContacts(clinic)) {
      const line = lineHref(clinic);
      const rows = [];
      if (line) {
        rows.push('<a class="btn btn-outline" href="' + escapeHtml(line) + '" target="_blank" rel="noopener">'
          + '\uD83D\uDCAC ' + (lang === 'zh' ? 'LINE \u8AEE\u8A62' : 'LINE')
          + (clinic.line_id ? ' <em class="line-id">' + escapeHtml(clinic.line_id) + '</em>' : '') + '</a>');
      }
      if (clinic.facebook_url) {
        rows.push('<a class="btn btn-outline" href="' + escapeHtml(clinic.facebook_url) + '" target="_blank" rel="noopener">'
          + '\uD83D\uDC4D ' + (lang === 'zh' ? 'Facebook \u7C89\u7D72\u9801' : 'Facebook') + '</a>');
      }
      if (clinic.instagram_url) {
        rows.push('<a class="btn btn-outline" href="' + escapeHtml(clinic.instagram_url) + '" target="_blank" rel="noopener">'
          + '\uD83D\uDCF7 Instagram</a>');
      }
      contactHtml = '<div class="panel"><div class="panel-head">'
        + (lang === 'zh' ? '\u806F\u7D61\u65B9\u5F0F' : 'Contact') + '</div>'
        + '<div class="contact-row">' + rows.join('') + '</div></div>';
    }

    const html = heroHtml +
      '<div class="clinic-wrap">' +
        '<div class="breadcrumb">' +
          '<a href="/">' + homeLbl + '</a>' +
          '<span class="breadcrumb-sep">/</span>' +
          '<a href="' + dirUrl + '">' + dirLbl + '</a>' +
          '<span class="breadcrumb-sep">/</span>' +
          '<span>' + escapeHtml(clinic.name) + '</span>' +
        '</div>' +
        '<span class="country-pill ' + countryClass + '">' + country + '</span>' +
        '<h1 class="clinic-name">' + escapeHtml(clinic.name) + '</h1>' +
        '<div class="clinic-location">' +
          '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
          escapeHtml(loc) + ', ' + escapeHtml(country) +
        '</div>' +
        ratingHtml +
        '<hr class="divider" />' +
        infoGridHtml +
        ((websiteBtn || mapsBtn) ? '<div class="action-row">' + websiteBtn + mapsBtn + '</div>' : '') +
        contactHtml +
        devicesHtml +
        teamHtml +
        photosHtml +
        '<div class="back-section">' +
          '<a href="' + dirUrl + '">' +
            '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>' +
            backLbl +
          '</a>' +
        '</div>' +
      '</div>';

    document.getElementById('clinic-root').innerHTML = html;

    injectJsonLd(clinic,
      'https://skinday.com/clinic/' + (clinic.slug || toSlug(clinic.name)),
      loc, country,
      photos.length ? photos[0] : '');

    // Hide SSR block if present (injected server-side)
    const ssr = document.getElementById('ssr-content');
    if (ssr) ssr.style.display = 'none';
  }

  function renderNotFound(slug) {
    const html = '<div class="clinic-wrap"><div class="not-found">' +
      '<h2>Clinic not found</h2>' +
      '<p>We could not find a clinic matching this URL.</p>' +
      '<a href="/" class="btn btn-primary">Back to SkinDay</a>' +
      '</div></div>';
    document.getElementById('clinic-root').innerHTML = html;
  }

  async function sbGet(path) {
    try {
      const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON }
      });
      if (!r.ok) { console.error('clinic-com: ' + r.status + ' on ' + path); return null; }
      return await r.json();
    } catch (e) { console.error('clinic-com:', e); return null; }
  }

  async function init() {
    // /clinic/drskin-ks -> drskin-ks
    const parts = window.location.pathname.split('/').filter(Boolean);
    let slug = decodeURIComponent(parts[parts.length - 1] || '');
    if (!slug || slug === 'clinic') {
      // ?slug= is a fallback so the page can be opened directly for testing.
      slug = new URLSearchParams(window.location.search).get('slug') || '';
    }
    if (!slug) { renderNotFound(''); return; }

    // ⛔ THIS IS THE FIX. The previous version fetched EVERY taiwan + hongkong
    // clinic and looked for one whose NAME slugified to the URL. Two failures in
    // one query. First, stored slugs are DOMAIN-derived since the slug migration
    // (drskin-ks), so a name-derived slug almost never matches and every profile
    // fell through to "Clinic not found". Second, PostgREST caps an unbounded
    // select at 1000 rows, so even a clinic that would have matched might not be
    // in the response at all.
    //
    // Now it asks the database the actual question: which clinic has this slug.
    const cols = 'id,name,slug,neighbourhood,region,city,country,lat,lng,phone,website,'
      + 'rating,reviews,photos,place_id,maps_url,facebook_url,instagram_url,line_url,line_id';
    const rows = await sbGet('clinics?select=' + cols
      + '&slug=eq.' + encodeURIComponent(slug)
      + '&country=in.(taiwan,hongkong)&approved=eq.true&limit=1');

    if (!rows || !rows.length) { renderNotFound(slug); return; }
    const clinic = rows[0];

    if (clinic.photos && typeof clinic.photos === 'string') {
      try { clinic.photos = JSON.parse(clinic.photos); } catch (e) { clinic.photos = []; }
    }

    // Doctors: two hops rather than a PostgREST embed, so it does not depend on
    // a named foreign key. An empty result is a legitimate state, not an error.
    let doctors = [];
    const links = await sbGet('clinic_doctors?select=doctor_id,title&clinic_id=eq.' + encodeURIComponent(clinic.id));
    if (links && links.length) {
      const ids = [];
      links.forEach(function (l) { if (ids.indexOf(l.doctor_id) === -1) ids.push(l.doctor_id); });
      const docs = await sbGet('doctors?select=id,name_zh&id=in.(' + ids.join(',') + ')');
      const byId = {};
      (docs || []).forEach(function (d) { byId[String(d.id)] = d; });
      links.forEach(function (l) {
        const d = byId[String(l.doctor_id)];
        if (!d) return;
        if (!doctors.some(function (x) { return String(x.id) === String(d.id); })) {
          doctors.push({ id: d.id, name_zh: d.name_zh, title: l.title || '' });
        }
      });
      doctors = orderTeam(doctors, clinic.name);
    }

    const techRows = await sbGet('clinic_technologies?select=technology&clinic_id=eq.' + encodeURIComponent(clinic.id));
    const devices = [];
    (techRows || []).forEach(function (t) {
      if (t.technology && devices.indexOf(t.technology) === -1) devices.push(t.technology);
    });

    renderClinic(clinic, doctors, devices);
  }

  init();
})();
</script>
